manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK v0.3.0: the Zephyr 3.5 generation used by the installed halves.
      revision: edf5c0814fd3ea202e43aad2d68fd32e882a518c
      import: app/west.yml
    # Match the exact Zephyr build string found in the original dongle backup.
    # A top-level project overrides the project imported from ZMK's manifest.
    - name: zephyr
      remote: zmkfirmware
      revision: 702e50c58f67c66a57d805ac8948d11ace938d4c
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config
